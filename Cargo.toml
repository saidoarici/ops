[workspace]
resolver = "2"
members = [
    "crates/ops-agent",
    "crates/ops-core",
    "crates/ops-daemon",
    "crates/ops-keychain",
    "crates/ops-observer",
    "crates/ops-remote",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Said"]
repository = "https://github.com/saidoarici/ops"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
strum = { version = "0.26", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
argon2 = "0.5"
subtle = "2"
